<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catálogo · Dilan Home</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --brown:#5a4a3a;
  --brown-light:#6b5b45;
  --gold:#b8986a;
  --bg:#f9f6f2;
  --bg-card:#fff;
  --bg-tag:#f5f0ea;
  --border:#e8ddd0;
  --border-soft:#ede8e0;
  --text:#333;
  --text-dark:#3a2e24;
  --text-muted:#999;
  --text-light:#aaa;
  --red:#c0392b;
  --green-bg:#eaf7ea;
  --green-text:#2e7d32;
  --red-bg:#fdecea;
}
body{font-family:'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ── HEADER ── */
header{background:var(--bg-card);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:0 2px 10px rgba(0,0,0,.07)}
.logo{font-size:20px;font-weight:700;letter-spacing:3px;color:var(--brown);text-decoration:none}
.logo span{color:var(--gold)}
.header-tag{font-size:11px;color:var(--text-light);background:var(--bg-tag);padding:4px 12px;border-radius:20px;letter-spacing:.5px}

/* ── TOOLBAR ── */
.toolbar{background:var(--bg-card);padding:14px 28px;border-bottom:1px solid var(--border-soft);display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:sticky;top:53px;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.search-wrap{position:relative;flex:1;min-width:200px;max-width:380px}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-light);pointer-events:none}
#search{width:100%;padding:9px 12px 9px 34px;border:1px solid #ddd;border-radius:8px;font-size:14px;outline:none;transition:border .2s,box-shadow .2s}
#search:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,152,106,.12)}
.selects{display:flex;gap:8px;flex-wrap:wrap}
select{padding:9px 12px;border:1px solid #ddd;border-radius:8px;font-size:13px;background:var(--bg-card);cursor:pointer;outline:none;color:var(--text);transition:border .2s}
select:focus{border-color:var(--gold)}
.result-count{font-size:12px;color:var(--text-muted);margin-left:auto;white-space:nowrap}

/* ── GRID ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;padding:22px 28px;max-width:1440px;margin:0 auto}

/* ── CARD ── */
.card{background:var(--bg-card);border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.07);cursor:pointer;transition:transform .18s,box-shadow .18s;display:flex;flex-direction:column;border:1px solid transparent}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.12);border-color:var(--border)}
.card-thumb{height:48px;background:linear-gradient(135deg,var(--brown) 0%,var(--brown-light) 100%);display:flex;align-items:center;justify-content:center}
.card-thumb-icon{font-size:20px;opacity:.45}
.card-body{padding:14px;flex:1;display:flex;flex-direction:column;gap:4px}
.card-rubro{font-size:10px;color:var(--gold);text-transform:uppercase;letter-spacing:1.2px;font-weight:700}
.card-name{font-size:13px;font-weight:600;color:var(--text-dark);line-height:1.4;flex:1;margin-top:2px}
.card-sku{font-size:10px;color:var(--text-light);margin-top:2px}
.card-footer{padding:0 14px 14px;display:flex;align-items:center;justify-content:space-between}
.card-price{font-size:18px;font-weight:700;color:var(--brown)}
.card-stock{font-size:10px;padding:3px 8px;border-radius:20px;font-weight:600}
.stock-ok{background:var(--green-bg);color:var(--green-text)}
.stock-low{background:#fff8e1;color:#e65100}
.stock-no{background:var(--red-bg);color:var(--red)}

/* ── ESTADOS ── */
.state{grid-column:1/-1;text-align:center;padding:80px 20px;color:var(--text-muted)}
.state-icon{font-size:40px;margin-bottom:14px}
.state h3{font-size:18px;color:var(--brown);margin-bottom:6px}
.state p{font-size:14px}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── OVERLAY / MODAL ── */
.overlay{display:none;position:fixed;inset:0;background:rgba(30,20,10,.65);z-index:500;overflow-y:auto;padding:32px 16px}
.overlay.open{display:flex;align-items:flex-start;justify-content:center}
.modal{background:var(--bg-card);border-radius:16px;max-width:820px;width:100%;padding:32px;position:relative;animation:rise .22s ease;box-shadow:0 20px 60px rgba(0,0,0,.25)}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.modal-close{position:absolute;top:14px;right:18px;font-size:24px;cursor:pointer;color:var(--text-light);background:none;border:none;line-height:1;transition:color .15s;padding:4px 8px;border-radius:6px}
.modal-close:hover{color:var(--text);background:var(--bg-tag)}
.modal-header{display:flex;gap:20px;margin-bottom:24px}
.modal-thumb{width:100px;height:100px;min-width:100px;border-radius:12px;background:linear-gradient(135deg,var(--brown) 0%,var(--brown-light) 100%);display:flex;align-items:center;justify-content:center;font-size:36px;opacity:.5}
.modal-info{flex:1}
.modal-rubro{font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:1.2px;font-weight:700;margin-bottom:6px}
.modal-title{font-size:20px;font-weight:700;color:var(--text-dark);line-height:1.35;margin-bottom:10px}
.modal-tags{display:flex;gap:8px;flex-wrap:wrap}
.modal-tag{font-size:11px;background:var(--bg-tag);padding:4px 10px;border-radius:20px;color:#777}

/* precio principal */
.price-section{margin:20px 0 0}
.price-main-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);margin-bottom:6px}
.price-main-value{font-size:34px;font-weight:700;color:var(--brown);line-height:1}

/* acordeon de precios */
.price-accordion{margin-top:14px;border:1px solid var(--border-soft);border-radius:10px;overflow:hidden}
.price-accordion-toggle{width:100%;background:var(--bg-tag);border:none;cursor:pointer;padding:11px 16px;display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;color:var(--brown);transition:background .15s}
.price-accordion-toggle:hover{background:#ede8da}
.price-accordion-toggle svg{transition:transform .2s}
.price-accordion-toggle.open svg{transform:rotate(180deg)}
.price-list{display:none;padding:0}
.price-list.open{display:block}
.price-row{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;border-top:1px solid var(--border-soft)}
.price-row:first-child{border-top:none}
.price-row-label{font-size:13px;color:var(--text)}
.price-row-badge{font-size:10px;background:#e8f4fd;color:#1565c0;padding:2px 7px;border-radius:10px;font-weight:600;margin-left:6px}
.price-row-value{font-size:15px;font-weight:700;color:var(--text-dark)}

/* stock en modal */
.modal-stock-row{display:flex;align-items:center;gap:10px;margin-top:18px}
.modal-stock-label{font-size:13px;color:var(--text-muted)}
.modal-stock-value{font-size:15px;font-weight:700;color:var(--brown)}
.modal-divider{border:none;border-top:1px solid var(--border-soft);margin:18px 0}

/* datos extra */
.modal-data-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px}
.modal-data-item{}
.modal-data-item dt{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--text-muted);margin-bottom:2px}
.modal-data-item dd{font-size:13px;font-weight:600;color:var(--text-dark)}

/* ── RESPONSIVE ── */
@media(max-width:600px){
  header{padding:12px 16px}
  .toolbar{padding:10px 16px;top:49px}
  .grid{padding:16px;gap:12px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  .modal{padding:20px}
  .modal-header{flex-direction:column;gap:12px}
  .price-main-value{font-size:26px}
  .modal-data-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header>
  <a class="logo" href="#">DILAN <span>HOME</span></a>
  <span class="header-tag">Catálogo interno</span>
</header>

<div class="toolbar">
  <div class="search-wrap">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="search" placeholder="Buscar por nombre, SKU o código de barras…" autocomplete="off">
  </div>
  <div class="selects">
    <select id="rubroFilter"><option value="">Todos los rubros</option></select>
    <select id="subRubroFilter"><option value="">Todos los sub-rubros</option></select>
    <select id="stockFilter">
      <option value="">Todo el stock</option>
      <option value="con">Con stock</option>
      <option value="sin">Sin stock</option>
    </select>
  </div>
  <span class="result-count" id="resultCount"></span>
</div>

<div class="grid" id="grid">
  <div class="state">
    <div class="spinner"></div>
    <h3>Cargando productos…</h3>
    <p>Conectando con la planilla de Google Sheets</p>
  </div>
</div>

<!-- MODAL -->
<div class="overlay" id="overlay" role="dialog" aria-modal="true">
  <div class="modal" id="modal">
    <button class="modal-close" id="modalClose" aria-label="Cerrar">✕</button>
    <div class="modal-header">
      <div class="modal-thumb" id="modalThumb">🏠</div>
      <div class="modal-info">
        <div class="modal-rubro" id="modalRubro"></div>
        <div class="modal-title" id="modalTitle"></div>
        <div class="modal-tags" id="modalTags"></div>
      </div>
    </div>

    <div class="price-section">
      <div class="price-main-label">Precio Final</div>
      <div class="price-main-value" id="modalPriceFinal"></div>
    </div>

    <div class="price-accordion" style="margin-top:14px">
      <button class="price-accordion-toggle" id="priceToggle" type="button">
        Ver todos los precios
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div class="price-list" id="priceList">
        <div class="price-row">
          <span class="price-row-label">Precio Final <span class="price-row-badge">Base</span></span>
          <span class="price-row-value" id="pr0"></span>
        </div>
        <div class="price-row">
          <span class="price-row-label">Precio de Lista <span class="price-row-badge">+20%</span></span>
          <span class="price-row-value" id="pr1"></span>
        </div>
        <div class="price-row">
          <span class="price-row-label">Precio Naranja 12 cuotas <span class="price-row-badge">+25%</span></span>
          <span class="price-row-value" id="pr2"></span>
        </div>
        <div class="price-row">
          <span class="price-row-label">Precio BNA 20 cuotas <span class="price-row-badge">+30%</span></span>
          <span class="price-row-value" id="pr3"></span>
        </div>
      </div>
    </div>

    <div class="modal-stock-row">
      <span class="modal-stock-label">Stock disponible:</span>
      <span class="modal-stock-value" id="modalStock"></span>
      <span class="card-stock" id="modalStockBadge"></span>
    </div>

    <hr class="modal-divider">

    <dl class="modal-data-grid" id="modalDataGrid"></dl>
  </div>
</div>

<script>
// ─── Config ───────────────────────────────────────────────────────────────────
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTLkXbbId74-n3qBAbYjEg2HQdLGNsPqyl4TpyYljWRNmI2srHJW5U2HRD2NQjm_w/pub?output=csv';

// Columnas por letra (0-based: A=0, B=1, C=2, D=3 …)
const COL_SKU   = 1;   // B - SKU
const COL_NAME  = 3;   // D - Nombre
const COL_BAR   = 8;   // I - Codigo Barras
const COL_PRICE = 16;  // Q - Precio Final
const COL_STOCK = 20;  // U - Stock Disponible
const COL_RUBRO = 23;  // X - Rubro
const COL_SUB   = 24;  // Y - Sub Rubro

// ─── Formato moneda ARS ───────────────────────────────────────────────────────
const ars = new Intl.NumberFormat('es-AR', { style:'currency', currency:'ARS', maximumFractionDigits:0 });

function fmt(n){ return isNaN(n) ? '—' : ars.format(n); }

// ─── Parser CSV robusto (RFC 4180) ───────────────────────────────────────────
function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQ = false, i = 0;
  while (i < text.length) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"' && text[i+1] === '"') { field += '"'; i += 2; continue; }
      if (ch === '"') { inQ = false; i++; continue; }
      field += ch;
    } else {
      if (ch === '"') { inQ = true; i++; continue; }
      if (ch === ',') { row.push(field.trim()); field = ''; i++; continue; }
      if (ch === '\n') { row.push(field.trim()); rows.push(row); row = []; field = ''; i++; continue; }
      if (ch === '\r') { i++; continue; }
      field += ch;
    }
    i++;
  }
  if (field || row.length) { row.push(field.trim()); rows.push(row); }
  return rows;
}

// ─── Parsear número (maneja puntos/comas de miles) ───────────────────────────
function parseNum(s) {
  if (!s) return NaN;
  // Formato argentino: 1.234,56  o  1234.56  o  1,234.56
  const clean = s.replace(/[^0-9.,-]/g, '');
  // Si tiene coma Y punto: la que aparece última es el decimal
  const lastComma = clean.lastIndexOf(',');
  const lastDot   = clean.lastIndexOf('.');
  if (lastComma > lastDot) {
    return parseFloat(clean.replace(/\./g,'').replace(',','.'));
  }
  return parseFloat(clean.replace(/,/g,''));
}

// ─── Datos ────────────────────────────────────────────────────────────────────
let allProducts = [];

async function loadData() {
  try {
    const res = await fetch(CSV_URL + '&t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    const rows = parseCSV(text);
    if (rows.length < 2) throw new Error('Planilla vacía');

    const products = [];
    for (let r = 1; r < rows.length; r++) {
      const row = rows[r];
      if (!row || row.length < 4) continue;
      const name = row[COL_NAME] || '';
      if (!name) continue;

      const price = parseNum(row[COL_PRICE]);
      const stock = parseNum(row[COL_STOCK]);

      products.push({
        name,
        sku:     row[COL_SKU]  || '',
        barcode: row[COL_BAR]  || '',
        price:   isNaN(price) ? 0 : price,
        stock:   isNaN(stock) ? 0 : Math.round(stock),
        rubro:   COL_RUBRO >= 0 ? (row[COL_RUBRO] || '') : '',
        sub:     COL_SUB   >= 0 ? (row[COL_SUB]   || '') : '',
        raw:     row,
      });
    }

    allProducts = products;
    buildFilters();
    render();
  } catch(e) {
    document.getElementById('grid').innerHTML = `
      <div class="state">
        <div class="state-icon">⚠️</div>
        <h3>No se pudo cargar la planilla</h3>
        <p>${e.message}<br><br>Verificá que la planilla esté publicada públicamente en Google Sheets.</p>
      </div>`;
  }
}

// ─── Filtros ─────────────────────────────────────────────────────────────────
function buildFilters() {
  const rubros   = [...new Set(allProducts.map(p => p.rubro).filter(Boolean))].sort();
  const subRubros= [...new Set(allProducts.map(p => p.sub  ).filter(Boolean))].sort();

  const rSel = document.getElementById('rubroFilter');
  rubros.forEach(r => { const o = new Option(r,r); rSel.appendChild(o); });

  const sSel = document.getElementById('subRubroFilter');
  subRubros.forEach(s => { const o = new Option(s,s); sSel.appendChild(o); });
}

// ─── Render ───────────────────────────────────────────────────────────────────
function stockClass(n) {
  if (n <= 0) return ['stock-no','Sin stock'];
  if (n <= 3) return ['stock-low', `Stock: ${n}`];
  return ['stock-ok', `Stock: ${n}`];
}

function render() {
  const q      = document.getElementById('search').value.toLowerCase().trim();
  const rubro  = document.getElementById('rubroFilter').value;
  const sub    = document.getElementById('subRubroFilter').value;
  const stock  = document.getElementById('stockFilter').value;

  const filtered = allProducts.filter(p => {
    if (q && !p.name.toLowerCase().includes(q) && !p.sku.toLowerCase().includes(q) && !p.barcode.includes(q)) return false;
    if (rubro && p.rubro !== rubro) return false;
    if (sub   && p.sub   !== sub  ) return false;
    if (stock === 'con' && p.stock <= 0) return false;
    if (stock === 'sin' && p.stock >  0) return false;
    return true;
  });

  document.getElementById('resultCount').textContent =
    filtered.length === allProducts.length
      ? `${allProducts.length} productos`
      : `${filtered.length} de ${allProducts.length}`;

  const grid = document.getElementById('grid');
  if (!filtered.length) {
    grid.innerHTML = `<div class="state"><div class="state-icon">🔍</div><h3>Sin resultados</h3><p>Probá con otro término o filtro.</p></div>`;
    return;
  }

  grid.innerHTML = filtered.map((p, idx) => {
    const [sc, sl] = stockClass(p.stock);
    const cat = [p.rubro, p.sub].filter(Boolean).join(' › ') || '&nbsp;';
    return `
    <div class="card" data-idx="${allProducts.indexOf(p)}" onclick="openModal(${allProducts.indexOf(p)})">
      <div class="card-thumb"><span class="card-thumb-icon">🏠</span></div>
      <div class="card-body">
        <div class="card-rubro">${cat}</div>
        <div class="card-name">${p.name}</div>
        <div class="card-sku">${p.sku ? 'SKU: ' + p.sku : ''}</div>
      </div>
      <div class="card-footer">
        <span class="card-price">${fmt(p.price)}</span>
        <span class="card-stock ${sc}">${sl}</span>
      </div>
    </div>`;
  }).join('');
}

// ─── Modal ────────────────────────────────────────────────────────────────────
function openModal(idx) {
  const p = allProducts[idx];
  if (!p) return;

  const cat = [p.rubro, p.sub].filter(Boolean).join(' › ');
  document.getElementById('modalRubro').textContent  = cat || '';
  document.getElementById('modalTitle').textContent  = p.name;

  // Tags (SKU, barcode)
  const tags = [];
  if (p.sku)     tags.push(`SKU: ${p.sku}`);
  if (p.barcode) tags.push(`Cód. barras: ${p.barcode}`);
  document.getElementById('modalTags').innerHTML = tags.map(t => `<span class="modal-tag">${t}</span>`).join('');

  // Precio final
  document.getElementById('modalPriceFinal').textContent = fmt(p.price);

  // Acordeón de precios
  document.getElementById('pr0').textContent = fmt(p.price);
  document.getElementById('pr1').textContent = fmt(p.price * 1.20);
  document.getElementById('pr2').textContent = fmt(p.price * 1.25);
  document.getElementById('pr3').textContent = fmt(p.price * 1.30);

  // Stock
  const [sc, sl] = stockClass(p.stock);
  document.getElementById('modalStock').textContent      = p.stock > 0 ? `${p.stock} unidades` : '0 unidades';
  document.getElementById('modalStockBadge').textContent = sl;
  document.getElementById('modalStockBadge').className   = `card-stock ${sc}`;

  // Datos extra
  const extras = [];
  if (p.rubro)   extras.push(['Rubro',     p.rubro]);
  if (p.sub)     extras.push(['Sub-Rubro', p.sub]);
  if (p.sku)     extras.push(['SKU',       p.sku]);
  if (p.barcode) extras.push(['Cód. Barras', p.barcode]);
  document.getElementById('modalDataGrid').innerHTML = extras.map(([k,v]) =>
    `<div class="modal-data-item"><dt>${k}</dt><dd>${v}</dd></div>`
  ).join('');

  // Reset acordeón
  document.getElementById('priceList').classList.remove('open');
  document.getElementById('priceToggle').classList.remove('open');

  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = '';
}

// ─── Eventos ──────────────────────────────────────────────────────────────────
document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('overlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// Acordeón precios
document.getElementById('priceToggle').addEventListener('click', function() {
  this.classList.toggle('open');
  document.getElementById('priceList').classList.toggle('open');
});

// Búsqueda con debounce
let debTimer;
document.getElementById('search').addEventListener('input', () => {
  clearTimeout(debTimer);
  debTimer = setTimeout(render, 180);
});

document.getElementById('rubroFilter').addEventListener('change', () => {
  // Al cambiar rubro, resetear sub-rubro y filtrar opciones disponibles
  const rubro = document.getElementById('rubroFilter').value;
  const sSel = document.getElementById('subRubroFilter');
  const current = sSel.value;

  // Rebuilding sub options filtered by rubro
  const subs = [...new Set(
    allProducts
      .filter(p => !rubro || p.rubro === rubro)
      .map(p => p.sub)
      .filter(Boolean)
  )].sort();

  sSel.innerHTML = '<option value="">Todos los sub-rubros</option>';
  subs.forEach(s => { const o = new Option(s,s); if (s === current) o.selected = true; sSel.appendChild(o); });

  render();
});
document.getElementById('subRubroFilter').addEventListener('change', render);
document.getElementById('stockFilter').addEventListener('change', render);

// ─── Iniciar ──────────────────────────────────────────────────────────────────
loadData();
</script>
</body>
</html>
